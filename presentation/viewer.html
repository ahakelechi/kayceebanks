<style>

  /* ---------- ambient backdrop ---------- */
  .bg { position: absolute; inset: 0; z-index: 0; overflow: hidden; }
  .bg .blob {
    position: absolute;
    width: 60vmax;
    height: 60vmax;
    border-radius: 50%;
    filter: blur(60px);

  .bg .blob.b { background: var(--blob-2); bottom: -25vmax; right: -18vmax; animation: driftB 54s ease-in-out infinite; }
  .bg .grid {
    position: absolute; inset: 0;
    background-image:

      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: radial-gradient(ellipse at center, black, transparent 75%);
  }
  @keyframes driftA {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(6vmax, 8vmax) scale(1.08); }
  }
  @keyframes driftB {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-7vmax, -6vmax) scale(1.05); }
  }
  @media (prefers-reduced-motion: reduce) {
    .bg .blob { animation: none !important; }
  }

  /* ---------- slides ---------- */
  .viewport {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
  }
  .slide {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    padding: clamp(28px, 7vw, 110px) clamp(28px, 9vw, 140px);
    opacity: 0;
    transform: translateY(18px) scale(0.99);
    pointer-events: none;
    transition: opacity .5s ease, transform .5s ease;
  }
  .slide.active {
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: auto;
  }
  .slide.center { align-items: center; text-align: center; }

  .kicker {
    font-size: clamp(11px, 1.1vw, 13px);
    letter-spacing: 0.14em;
    text-transform: uppercase;

    font-weight: 600;

  .active .kicker { animation: riseIn .6s ease both; animation-delay: .05s; }

  .slide h2 {

    font-weight: 500;
    line-height: 1.06;
    max-width: 20ch;
    opacity: 0;
  }
  .active h2 { animation: riseIn .7s ease both; animation-delay: .12s; }

  .deck {
    list-style: none;
    margin: clamp(22px, 3.4vw, 40px) 0 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: clamp(14px, 2vw, 20px);
    max-width: 46ch;

  .deck li {

    gap: 14px;
    font-size: clamp(16px, 2vw, 23px);
    line-height: 1.45;
    color: var(--ink-muted);
    opacity: 0;

  .deck li::before {
    content: "";
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    margin-top: 10px;
    flex: none;

  .active .deck li { animation: riseIn .55s ease both; }
  .active .deck li:nth-child(1) { animation-delay: .22s; }
  .active .deck li:nth-child(2) { animation-delay: .34s; }
  .active .deck li:nth-child(3) { animation-delay: .46s; }
  .active .deck li:nth-child(4) { animation-delay: .58s; }

    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }

  /* ---------- split layout (text + supporting figure) ---------- */
  .split {
    display: grid;
    grid-template-columns: minmax(240px, 1fr) minmax(260px, 1.1fr);
    gap: clamp(28px, 4vw, 64px);
    align-items: center;
    width: 100%;

  .split-text h2 { font-size: clamp(24px, 3.3vw, 42px); max-width: none; }
  .split-text .deck { max-width: none; }
  .split-viz {
    max-width: 480px;
    width: 100%;
    justify-self: center;
  }
  .split-viz figure { margin: 0; }
  .split-viz svg { width: 100%; height: auto; display: block; overflow: visible; }
  .split-viz figcaption {
    margin-top: clamp(10px, 1.4vw, 14px);

  .vpart { opacity: 0; }

    to { opacity: 1; transform: translateY(0); }

  .vline {

  }
  .active .vline { animation: vDraw .7s ease-out both; }
  @keyframes vDraw { to { stroke-dashoffset: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .vpart { animation: none !important; opacity: 1 !important; transform: none !important; }
    .vline { animation: none !important; stroke-dashoffset: 0 !important; }

  /* ---------- 2x2 question grid ---------- */
  .grid2 {
    display: grid;
    grid-template-columns: repeat(2, minmax(220px, 1fr));
    gap: clamp(14px, 2vw, 20px);
    margin-top: clamp(24px, 3.6vw, 40px);
    max-width: 62ch;
    width: 100%;
  }
  .card {

    border: 1px solid var(--border);

  .active .card:nth-child(2) { animation-delay: .32s; }

  .card p { margin: 0; font-size: clamp(15px, 1.7vw, 19px); color: var(--ink); line-height: 1.4; font-weight: 500; }

  /* ---------- 5-up radar list ---------- */
  .radar {
    list-style: none;
    margin: clamp(22px, 3.2vw, 36px) 0 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: clamp(12px, 1.6vw, 16px);

    width: 100%;

  .radar li {

    grid-template-columns: minmax(140px, 200px) 1fr;
    gap: 18px;
    align-items: baseline;
    padding: clamp(10px, 1.4vw, 14px) 0;
    border-bottom: 1px solid var(--border);
    opacity: 0;
  }
  .active .radar li { animation: riseIn .5s ease both; }
  .active .radar li:nth-child(1) { animation-delay: .20s; }
  .active .radar li:nth-child(2) { animation-delay: .30s; }
  .active .radar li:nth-child(3) { animation-delay: .40s; }
  .active .radar li:nth-child(4) { animation-delay: .50s; }
  .active .radar li:nth-child(5) { animation-delay: .60s; }
  .radar .rlabel { font-weight: 600; color: var(--ink); font-size: clamp(15px, 1.7vw, 19px); }
  .radar .rtext { color: var(--ink-muted); font-size: clamp(14px, 1.5vw, 17px); line-height: 1.4; }

  /* ---------- 3-column recs ---------- */
  .cols3 {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: clamp(14px, 2vw, 20px);
    margin-top: clamp(22px, 3.2vw, 36px);
    max-width: 78ch;
    width: 100%;
  }
  .col2 {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: clamp(16px, 2vw, 22px);
    opacity: 0;
    box-shadow: 0 10px 30px -18px rgba(10,20,17,0.25);
  }
  .active .col2 { animation: riseIn .55s ease both; }
  .active .col2:nth-child(1) { animation-delay: .22s; }
  .active .col2:nth-child(2) { animation-delay: .34s; }
  .active .col2:nth-child(3) { animation-delay: .46s; }
  .col2 .tag { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: 0.06em; color: var(--accent-strong); font-weight: 600; }
  .col2 h3 { font-size: clamp(16px, 1.9vw, 19px); font-weight: 500; margin: 6px 0 10px; color: var(--ink); }
  .col2 ul { margin: 0; padding-left: 16px; color: var(--ink-muted); font-size: clamp(12.5px, 1.4vw, 14.5px); line-height: 1.6; }

  /* ---------- closing ---------- */
  .takeaway {
    font-family: "Newsreader", serif;
    font-style: italic;
    font-size: clamp(24px, 4vw, 42px);
    line-height: 1.35;
    max-width: 22ch;
    opacity: 0;
  }
  .active .takeaway { animation: riseIn .7s ease both; animation-delay: .18s; }
  .close-lines {
    margin-top: clamp(24px, 3.4vw, 38px);

    flex-wrap: wrap;
    gap: 10px 28px;
    justify-content: center;
    max-width: 70ch;
  }
  .close-lines span {
    font-size: clamp(13px, 1.5vw, 16px);
    color: var(--ink-muted);
    opacity: 0;
  }
  .active .close-lines span { animation: riseIn .5s ease both; }
  .active .close-lines span:nth-child(1) { animation-delay: .34s; }
  .active .close-lines span:nth-child(2) { animation-delay: .42s; }
  .active .close-lines span:nth-child(3) { animation-delay: .50s; }
  .active .close-lines span:nth-child(4) { animation-delay: .58s; }
  .thanks {
    margin-top: clamp(30px, 4vw, 46px);
    font-size: clamp(14px, 1.6vw, 17px);
    color: var(--accent-strong);
    font-weight: 600;
    letter-spacing: 0.03em;
    opacity: 0;

  .active .thanks { animation: riseIn .5s ease both; animation-delay: .7s; }

  /* ---------- references ---------- */
  .refs {
    list-style: none;
    margin: clamp(24px, 3.4vw, 40px) 0 0;

  .titleslide .sub {

    font-size: clamp(15px, 1.8vw, 20px);

  .active .titleslide .sub { animation: riseIn .6s ease both; animation-delay: .3s; }
  .titleslide .byline {

    gap: 10px;
    font-family: "IBM Plex Mono", monospace;

  /* ---------- chrome ---------- */
  .chrome {
    position: absolute;
    z-index: 2;
    inset: 0;
    pointer-events: none;

  .clickzone {

  .arrow {

  .dots {

  .dot {

  .counter {

    bottom: clamp(14px, 2.4vw, 26px);
    right: clamp(16px, 3vw, 32px);

    font-size: 12px;

  }

  .fsbtn {
    position: absolute;
    top: clamp(14px, 2.4vw, 26px);
    right: clamp(16px, 3vw, 32px);
    width: 38px; height: 38px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: color-mix(in srgb, var(--surface) 85%, transparent);

  }

  .brand {
    position: absolute;
    top: clamp(14px, 2.4vw, 26px);
    left: clamp(16px, 3vw, 32px);
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-faint);
    pointer-events: none;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .brand .presenter { color: var(--accent-strong); }

  @media (max-width: 700px) {
    .grid2 { grid-template-columns: 1fr; }
    .cols3 { grid-template-columns: 1fr; }
    .radar li { grid-template-columns: 1fr; gap: 4px; }
    .arrow { display: none; }
    .split { grid-template-columns: 1fr; }
    .split-viz { max-width: 340px; }
  }
</style>

</div>

    zeroTrust: function () {

        "</g>" +
        "</svg><figcaption><b>Same breach, different outcome.</b> In a perimeter model, one login trusts everything inside, so a compromised account moves freely. Zero Trust checks identity and context on every request, so that same account is stopped at the next hop (Deloitte, 2026).</figcaption></figure>";

    attackChain: function () {
      var boxes = [

  function buildSlide(s, idx) {
    var el = document.createElement("section");
    el.className = "slide";
    el.dataset.index = idx;
    var html = "";

    if (s.type === "title") {
      el.classList.add("center", "titleslide");
      html = '<div class="kicker">' + s.kicker + '</div><h2>' + s.title + '</h2><p class="sub">' + s.sub + '</p><div class="byline">' + s.byline + "</div>";
    } else if (s.type === "bullets") {
      var textHtml = '<div class="kicker">' + s.kicker + '</div><h2>' + s.title + '</h2><ul class="deck">' +
        s.items.map(function (i) { return "<li>" + i + "</li>"; }).join("") + "</ul>";
      if (s.viz && VIZ[s.viz]) {
        html = '<div class="split"><div class="split-text">' + textHtml + '</div><div class="split-viz">' + VIZ[s.viz]() + "</div></div>";
      } else {
        html = textHtml;
      }
    } else if (s.type === "grid2") {
      html = '<div class="kicker">' + s.kicker + '</div><h2>' + s.title + "</h2>" + cardsHtml(s.cards);
    } else if (s.type === "radar") {
      html = '<div class="kicker">' + s.kicker + '</div><h2>' + s.title + "</h2>" + radarHtml(s.items);
    } else if (s.type === "cols3") {
      html = '<div class="kicker">' + s.kicker + '</div><h2>' + s.title + "</h2>" + cols3Html(s.cols);
    } else if (s.type === "closing") {
      el.classList.add("center");
      html = '<div class="kicker">' + s.kicker + '</div><div class="takeaway">“' + s.takeaway + '”</div>' +
        '<div class="close-lines">' + s.lines.map(function (l) { return "<span>" + l + "</span>"; }).join("") + "</div>" +
        '<div class="thanks">' + s.thanks + "</div>";
    } else if (s.type === "references") {
      html = '<div class="kicker">' + s.kicker + '</div><h2>' + s.title + '</h2><ul class="refs">' +
        s.refs.map(function (r) { return "<li>" + r + "</li>"; }).join("") + '</ul><p class="refs-note">' + s.note + "</p>";
    }
    el.innerHTML = html;
    return el;
  }

  SLIDES.forEach(function (s, i) { viewport.appendChild(buildSlide(s, i)); });
  var slideEls = viewport.querySelectorAll(".slide");

  SLIDES.forEach(function (s, i) {
    var dot = document.createElement("button");
    dot.className = "dot";
    dot.setAttribute("aria-label", "Go to slide " + (i + 1));
    dot.addEventListener("click", function () { goTo(i); });
    dotsEl.appendChild(dot);
  });
  var dotEls = dotsEl.querySelectorAll(".dot");

  var zoneLeft = document.getElementById("zoneLeft");
  var zoneRight = document.getElementById("zoneRight");

  function render() {
    slideEls.forEach(function (el, i) { el.classList.toggle("active", i === current); });
    dotEls.forEach(function (d, i) { d.classList.toggle("on", i === current); });
    counterEl.textContent = String(current + 1).padStart(2, "0") + " / " + String(SLIDES.length).padStart(2, "0");
    prevArrow.disabled = current === 0;
    nextArrow.disabled = current === SLIDES.length - 1;
    // Slides with a real link (e.g. References) need clicks to reach the
    // link rather than be swallowed by the edge click-to-navigate zones.
    var hasLink = SLIDES[current].type === "references";
    zoneLeft.classList.toggle("suspended", hasLink);
    zoneRight.classList.toggle("suspended", hasLink);
    try { localStorage.setItem("ncb-viewer-slide", String(current)); } catch (e) {}
  }

  function goTo(i) {
    current = Math.max(0, Math.min(SLIDES.length - 1, i));
    render();
  }

  document.getElementById("zoneLeft").addEventListener("click", function () { goTo(current - 1); });
  document.getElementById("zoneRight").addEventListener("click", function () { goTo(current + 1); });
  prevArrow.addEventListener("click", function (e) { e.stopPropagation(); goTo(current - 1); });
  nextArrow.addEventListener("click", function (e) { e.stopPropagation(); goTo(current + 1); });

  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") { e.preventDefault(); goTo(current + 1); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); goTo(current - 1); }
    else if (e.key === "Home") { goTo(0); }
    else if (e.key === "End") { goTo(SLIDES.length - 1); }
    else if (e.key === "f" || e.key === "F") { toggleFullscreen(); }
  });

  var stage = document.getElementById("stage");
  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      stage.requestFullscreen && stage.requestFullscreen();
    } else {
      document.exitFullscreen && document.exitFullscreen();
    }
  }
  document.getElementById("fsBtn").addEventListener("click", toggleFullscreen);

  var saved = 0;
  try { saved = parseInt(localStorage.getItem("ncb-viewer-slide"), 10) || 0; } catch (e) {}
  goTo(saved);
})();
